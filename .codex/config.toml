  [mcp_servers.unreal-mcp]
    url = "http://127.0.0.1:8000/mcp"

  [mcp_servers.rider]
    url = "http://127.0.0.1:64482/stream"

  [mcp_servers.notion]
    url = "https://mcp.notion.com/mcp"

  [mcp_servers.blender]
  command = 'C:\Users\user\.local\bin\uvx.exe'
  args = ["--python", 'C:\Users\user\AppData\Roaming\uv\python\cpython-3.11.16-windows-x86_64-none\python.exe', "blender-mcp"]

  [mcp_servers.blender.env]
  BLENDER_HOST = "localhost"
  BLENDER_PORT = "9876"
  DISABLE_TELEMETRY = "true"